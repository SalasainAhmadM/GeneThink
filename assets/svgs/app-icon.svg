<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GeneThink app icon: purple lab gradient, neon helix seen through a gold magnifier -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1B0B5A"/>
      <stop offset="0.5" stop-color="#3B1A9E"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3A1C9E"/>
      <stop offset="1" stop-color="#1B0B5A"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE97A"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lensClip"><circle cx="452" cy="440" r="196"/></clipPath>
  </defs>
  <g id="bgLayer">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="470" r="460" fill="url(#glow)"/>
    <g fill="#ffffff" opacity="0.35">
      <circle cx="150" cy="420" r="7"/><circle cx="880" cy="300" r="6"/>
      <circle cx="210" cy="860" r="6"/><circle cx="820" cy="900" r="8"/>
    </g>
  </g>
  <g id="mark">
    <!-- handle -->
    <g transform="rotate(-45 690 690)">
      <rect x="640" y="600" width="100" height="300" rx="50" fill="url(#handle)" stroke="#1B0B5A" stroke-width="24"/>
      <rect x="664" y="640" width="22" height="200" rx="11" fill="#ffffff" opacity="0.35"/>
    </g>
    <!-- rim -->
    <circle cx="452" cy="440" r="262" fill="url(#rim)" stroke="#1B0B5A" stroke-width="26"/>
    <circle cx="452" cy="440" r="204" fill="url(#lens)" stroke="#1B0B5A" stroke-width="16"/>
    <!-- neon helix inside the lens -->
    <g clip-path="url(#lensClip)" stroke-linecap="round" filter="url(#neon)">
      <g stroke-width="20">
        <line x1="400" y1="300" x2="504" y2="300" stroke="#FFC928"/>
        <line x1="372" y1="370" x2="532" y2="370" stroke="#F472B6"/>
        <line x1="408" y1="440" x2="496" y2="440" stroke="#67E8F9"/>
        <line x1="372" y1="510" x2="532" y2="510" stroke="#FFC928"/>
        <line x1="400" y1="580" x2="504" y2="580" stroke="#F472B6"/>
      </g>
      <path d="M372 240c0 90 160 130 160 200s-160 110-160 200" fill="none" stroke="#C084FC" stroke-width="38"/>
      <path d="M532 240c0 90-160 130-160 200s160 110 160 200" fill="none" stroke="#67E8F9" stroke-width="38"/>
      <circle cx="372" cy="370" r="15" fill="#F472B6"/><circle cx="532" cy="370" r="15" fill="#C084FC"/>
      <circle cx="372" cy="510" r="15" fill="#C084FC"/><circle cx="532" cy="510" r="15" fill="#F472B6"/>
    </g>
    <ellipse cx="350" cy="320" rx="34" ry="72" fill="#ffffff" opacity="0.3" transform="rotate(35 350 320)"/>
    <!-- sparkles -->
    <g fill="#FFE97A">
      <path d="M800 170l18 44 44 18-44 18-18 44-18-44-44-18 44-18z"/>
      <path d="M180 690l13 32 32 13-32 13-13 32-13-32-32-13 32-13z"/>
      <path d="M770 470l9 22 22 9-22 9-9 22-9-22-22-9 22-9z" opacity="0.85"/>
    </g>
  </g>
</svg>
