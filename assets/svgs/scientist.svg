<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Gregor Mendel. GeneQuest art kit: ink #2A1066, flat fills, hard shadow bottom-right -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- brown robe -->
    <path d="M18 128c4-26 22-40 46-40s42 14 46 40z" fill="#6B3F22"/>
    <path d="M18 128c4-25 21-37 43-37s39 12 43 37z" fill="#8A5530"/>
    <path d="M18 128c4-26 22-40 46-40s42 14 46 40z" fill="none" stroke="#2A1066" stroke-width="4.5"/>
    <path d="M50 90l14 15 14-15" fill="#fff" stroke="#2A1066" stroke-width="4"/>
    <!-- head -->
    <circle cx="64" cy="56" r="30" fill="#F0B48A"/>
    <circle cx="61" cy="53" r="26" fill="#FFD3AE"/>
    <circle cx="64" cy="56" r="30" fill="none" stroke="#2A1066" stroke-width="4.5"/>
    <!-- hair (side and top) -->
    <path d="M34 54c0-20 12-32 30-32s30 12 30 32c-4-6-8-10-12-10-6-6-12-8-18-8s-12 2-18 8c-4 0-8 4-12 10z" fill="#6B3F22" stroke="#2A1066" stroke-width="4.5"/>
    <!-- round glasses -->
    <circle cx="52" cy="58" r="9" fill="#fff" fill-opacity="0.5" stroke="#2A1066" stroke-width="4"/>
    <circle cx="76" cy="58" r="9" fill="#fff" fill-opacity="0.5" stroke="#2A1066" stroke-width="4"/>
    <path d="M61 58h6" stroke="#2A1066" stroke-width="4"/>
    <ellipse cx="53" cy="59" rx="3" ry="3.6" fill="#2A1066"/>
    <ellipse cx="77" cy="59" rx="3" ry="3.6" fill="#2A1066"/>
    <path d="M55 73c6 5 12 5 18 0" fill="none" stroke="#2A1066" stroke-width="4"/>
    <ellipse cx="42" cy="70" rx="5" ry="3" fill="#F0559B" opacity="0.45"/>
    <ellipse cx="86" cy="70" rx="5" ry="3" fill="#F0559B" opacity="0.45"/>
    <!-- pea pod in hand -->
    <path d="M84 104c8-8 18-10 26-5-3 10-13 15-24 12z" fill="#2E9440"/>
    <path d="M83 102c8-7 17-9 24-5-3 9-12 13-22 11z" fill="#4CC35A"/>
    <path d="M84 104c8-8 18-10 26-5-3 10-13 15-24 12z" fill="none" stroke="#2A1066" stroke-width="3.5"/>
    <circle cx="93" cy="105" r="3.2" fill="#8FE07A" stroke="#2A1066" stroke-width="2"/>
    <circle cx="101" cy="103" r="3.2" fill="#8FE07A" stroke="#2A1066" stroke-width="2"/>
  </g>
</svg>
